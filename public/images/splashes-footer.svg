<?xml version="1.0" encoding="UTF-8"?>
<!--
  FONDO PROVISORIO — salpicaduras de pintura (footer Barbería Torito).
  Manchas y gotas en rojo #DC2626, azul #2563EB y negro #111111,
  concentradas en esquinas y bordes; el centro queda prácticamente limpio
  para no afectar el contraste del texto.

  // PENDIENTE: reemplazar por el arte original del diseño (Torito_footer).
  Reposición sugerida: mismo encuadre a sangre (cover) y centro libre de manchas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true" focusable="false">
  <g fill="#DC2626">
    <!-- Esquina superior izquierda -->
    <path d="M8 84c30-46 86-64 140-48 44 13 60 50 38 84-20 32-72 44-118 34C34 146 6 120 8 84Z"/>
    <path d="M120 40c26-14 58-10 76 8 12 12 6 30-12 34-24 6-52 2-68-10-10-8-8-22 4-32Z" opacity=".85"/>
    <circle cx="196" cy="70" r="7"/>
    <circle cx="226" cy="96" r="4"/>
    <circle cx="176" cy="150" r="5"/>
    <circle cx="92" cy="164" r="4"/>
    <!-- Borde izquierdo -->
    <circle cx="34" cy="250" r="8" opacity=".8"/>
    <circle cx="58" cy="292" r="5" opacity=".7"/>
    <circle cx="20" cy="330" r="4" opacity=".6"/>
    <!-- Esquina inferior derecha -->
    <path d="M1436 486c-28 44-84 60-138 44-42-13-58-48-36-82 20-30 70-42 114-32 42 10 68 34 60 70Z"/>
    <circle cx="1360" cy="520" r="8"/>
    <circle cx="1388" cy="492" r="5"/>
    <circle cx="1312" cy="546" r="4"/>
  </g>

  <g fill="#2563EB">
    <!-- Esquina superior derecha -->
    <path d="M1432 60c-26-42-80-58-130-44-40 12-56 46-36 78 18 30 66 42 110 32 38-8 62-34 56-66Z"/>
    <path d="M1300 22c-24-12-52-8-68 8-10 11-4 27 12 31 22 6 46 2 60-8 10-8 8-20-4-31Z" opacity=".85"/>
    <circle cx="1236" cy="70" r="6"/>
    <circle cx="1210" cy="98" r="4"/>
    <!-- Borde derecho -->
    <circle cx="1404" cy="240" r="7" opacity=".8"/>
    <circle cx="1380" cy="286" r="5" opacity=".7"/>
    <circle cx="1416" cy="330" r="4" opacity=".6"/>
    <!-- Esquina inferior izquierda -->
    <path d="M4 482c24 44 78 62 130 46 40-12 54-48 32-80-20-30-68-42-112-30-40 12-64 34-50 64Z"/>
    <circle cx="80" cy="520" r="7"/>
    <circle cx="52" cy="492" r="4"/>
  </g>

  <g fill="#111111">
    <!-- Manchas/gotas negras repartidas por bordes -->
    <path d="M40 430c18-24 48-30 72-18 18 9 20 30 4 42-20 14-52 14-72 0-10-7-10-16-4-24Z" opacity=".9"/>
    <path d="M1366 40c16-22 46-28 70-16 18 9 18 28 2 40-20 14-52 12-70-2-9-7-8-15-2-22Z" opacity=".9"/>
    <circle cx="250" cy="30" r="6"/>
    <circle cx="286" cy="52" r="4"/>
    <circle cx="1180" cy="530" r="6"/>
    <circle cx="1144" cy="504" r="4"/>
    <circle cx="700" cy="540" r="4" opacity=".5"/>
    <circle cx="760" cy="546" r="3" opacity=".4"/>
  </g>

  <!-- Centro: apenas unas gotas muy tenues, lejos de cualquier texto -->
  <g fill="#111111" opacity=".06">
    <circle cx="520" cy="120" r="5"/>
    <circle cx="930" cy="120" r="5"/>
    <circle cx="520" cy="450" r="5"/>
    <circle cx="930" cy="450" r="5"/>
  </g>
</svg>
